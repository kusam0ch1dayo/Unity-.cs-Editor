# リリースを作成して、アプリの zip を添付する。
# - Actions タブの「Run workflow」でタグ名 (例: v1.0.0) を入力すると、タグとリリースを作成する
# - GitHub の画面でリリースを公開した場合は、そのリリースに zip を添付する
# リリースノートは .github/release-notes/<タグ名>.md を使う (なければ自動生成)。
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'タグ名 (例: v1.0.0)'
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build zip
        run: |
          name="Unity-Block-Coder-${TAG}"
          mkdir "$name"
          cp -r index.html css js README.md LICENSE "$name"/
          zip -r "$name.zip" "$name"

      - name: Create release or attach zip
        run: |
          zip="Unity-Block-Coder-${TAG}.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            notes=".github/release-notes/${TAG}.md"
            if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
            gh release create "$TAG" "$zip" --target "$GITHUB_SHA" --title "$TAG" "$@"
          fi
