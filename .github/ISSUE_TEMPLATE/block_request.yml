name: ブロック追加の依頼 / Block request
description: 専用ブロックがない C# の書き方を、ブロックとして追加してほしい
labels: [block request]
body:
  - type: markdown
    attributes:
      value: |
        C# を読み込んで「C# 文 / 式 / メンバー」ブロックになった部分は、読み込みログの「依頼文を作成」でまとめられます。
        作った依頼文を下の欄にそのまま貼り付けてください。
        自分でブロックを足したい場合は、拡張パック ([docs/block-packs.md](https://github.com/kusam0ch1dayo/Unity-Block-Coder/blob/main/docs/block-packs.md)) でも追加できます。
  - type: textarea
    id: request
    attributes:
      label: 依頼文、または足りないブロックの説明 / Request
      description: 「依頼文を作成」の内容、または追加してほしい C# の例
      render: markdown
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 使いたい場面 / Use case
      description: どんなスクリプトで使いたいか (任意)
