<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity Block Coder</title>
<!-- ライブラリは vendor/ に同梱 (オフラインでも動く)。Blockly のメッセージは表示言語に合わせて読み込む -->
<script>
window.LANG = (() => { try { return localStorage.getItem('unity-block-coder-lang'); } catch (e) { return null; } })()
  || ((navigator.language || '').startsWith('ja') ? 'ja' : 'en');
</script>
<script src="vendor/blockly/blockly_compressed.js"></script>
<script src="vendor/blockly/blocks_compressed.js"></script>
<script>document.write(`<script src="vendor/blockly/msg/${LANG === 'en' ? 'en' : 'ja'}.js"><\/script>`);</script>
<script src="vendor/tree-sitter/tree-sitter.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#3b6fd8">
</head>
<body>
<header>
  <h1><img src="icons/icon-192.png" alt="">Unity Block Coder <small>ブロック → C#</small> <span id="appVersion"></span></h1>
  <input id="search" type="search" placeholder="🔍 ブロック検索 (Ctrl+K)" autocomplete="off">
  <div id="shortcuts"></div>
  <nav id="menus"></nav>
  <!-- 各操作の本体。画面には出さず、メニュー・ショートカットから呼び出す -->
  <div hidden>
    <button id="undo"></button><button id="redo"></button><button id="learn"></button><button id="beginner"></button>
    <button id="templates"></button><button id="import"></button><button id="sample"></button><button id="clear"></button><button id="theme"></button>
  </div>
</header>
<div id="menuPanel" class="menu-panel" hidden></div>
<dialog id="settingsDlg">
  <div class="settings-head"><h2>⚙ 設定</h2><button id="settingsClose">閉じる</button></div>
  <div id="settingsBody"></div>
</dialog>
<dialog id="importDlg">
  <h2>C# を読み込んでブロックに変換</h2>
  <textarea id="importSrc" spellcheck="false" placeholder="ここに C# コードを貼り付けるか、ファイルを選んでください"></textarea>
  <div class="row"><input type="file" id="importFile" accept=".cs,text/plain" multiple><label><input type="checkbox" id="importNewTab" checked> 新しいタブで開く</label><label><input type="checkbox" id="importAppend"> 今のブロックに追加する</label></div>
  <p id="importMsg"></p>
  <div class="row end"><button id="importCancel">キャンセル</button><button id="importGo" class="primary">ブロックに変換</button></div>
</dialog>
<dialog id="reqDlg">
  <h2>ブロック追加の依頼文</h2>
  <p class="hint">この文章をコピーして Claude のセッションに貼り付けると、足りないブロックをまとめて追加できます。</p>
  <textarea id="reqText" readonly spellcheck="false"></textarea>
  <div class="row end"><button id="reqClose">閉じる</button><button id="reqSave">.md 保存</button><button id="reqCopy" class="primary">コピー</button></div>
</dialog>
<dialog id="tplDlg">
  <h2>テンプレート</h2>
  <p class="hint">よく作るスクリプトを新しいタブで開きます。開いたあとは自由に編集できます。</p>
  <div id="tplList"></div>
  <p id="tplMsg"></p>
  <div class="row end"><button id="tplClose">閉じる</button></div>
</dialog>
<dialog id="learnDlg">
  <div id="learnBody"></div>
  <div class="row end"><button id="learnClose">閉じる</button></div>
</dialog>
<dialog id="welcomeDlg"><div id="welcomeBody"></div></dialog>
<div id="toast" hidden></div>
<main>
  <div id="left"><div id="tabs"></div><div id="blocks"></div><div id="tutor" hidden></div></div>
  <div id="side">
    <div class="bar"><span id="fname">Script.cs</span><b id="status"></b><label class="memo" title="ブロックに付けたメモ (右クリック →「コメントを追加」) を // コメントとして出力"><input type="checkbox" id="memoOut"> メモ出力</label><button id="copy">コピー</button><button id="dl" class="primary">.cs 保存</button><button id="zip" title="全タブのスクリプトを zip で保存">全部 zip</button></div>
    <pre id="code"></pre>
    <div class="tabs"><button id="tabIssues" class="on">問題</button><button id="tabHelp">ヘルプ</button><button id="tabHints">ヒント</button><button id="tabInspector">インスペクター</button><button id="tabOutline">目次</button><button id="tabLog">読み込みログ</button></div>
    <div id="issues"></div>
    <div id="help" hidden></div>
    <div id="hints" hidden></div>
    <div id="inspector" hidden></div>
    <div id="outline" hidden></div>
    <div id="importLog" hidden><div id="collectBar" hidden></div><div id="logBody"><div class="ok"><small>C# を読み込むと、ブロック化できなかった箇所と足りないブロックがここに表示されます</small></div></div></div>
  </div>
</main>
<script src="js/version.js"></script>
<script src="js/i18n.js"></script>
<script src="js/help-data.js"></script>
<script src="js/blocks.js"></script>
<script src="js/generator.js"></script>
<script src="js/codestyle.js"></script>
<script src="js/toolbox.js"></script>
<script src="js/types.js"></script>
<script src="js/checker.js"></script>
<script src="js/unityver.js"></script>
<script src="js/autocomplete.js"></script>
<script src="js/importer.js"></script>
<script src="js/packs/ai-navigation.js"></script>
<script src="js/packs/input-system.js"></script>
<script src="js/packs/basics.js"></script>
<script src="js/packs.js"></script>
<script src="js/app.js"></script>
<script src="js/theme.js"></script>
<script src="js/search.js"></script>
<script src="js/refactor.js"></script>
<script src="js/project.js"></script>
<script src="js/templates.js"></script>
<script src="js/learn.js"></script>
<script src="js/projectfile.js"></script>
<script src="js/snippets.js"></script>
<script src="js/pwa.js"></script>
<script src="js/editor.js"></script>
<script src="js/diff.js"></script>
<script src="js/assets.js"></script>
<script src="js/paste.js"></script>
<script src="js/inspector.js"></script>
<script src="js/tools.js"></script>
<script src="js/about.js"></script>
<script src="js/layout.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
