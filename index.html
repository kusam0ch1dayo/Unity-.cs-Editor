<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity Block Coder</title>
<!-- 外部ライブラリは integrity (SRI) で中身を検証する。ハッシュは npm の公式パッケージから計算 -->
<script src="https://unpkg.com/blockly@11.1.1/blockly_compressed.js"
  integrity="sha384-5KF3IDIFEkYlDEtdVVThdjEM5vmGuetBFKw2/4k1vAZV2o8uh8Hjg34DdOOYQ3AV" crossorigin="anonymous"></script>
<script src="https://unpkg.com/blockly@11.1.1/blocks_compressed.js"
  integrity="sha384-ihlfF0dYpITyT7IOlAV6Uj+88pXaS/5eRJC0A7xmzX6VIm/Q8Y51+DhHlSq76ZTq" crossorigin="anonymous"></script>
<script src="https://unpkg.com/blockly@11.1.1/msg/ja.js"
  integrity="sha384-vwDwBIqpZ3trnzftlXPz5I2KLW59rnUE3qmcgJ/PRqFMMtz0GRpLJcwHfc0X7s2r" crossorigin="anonymous"></script>
<script src="https://unpkg.com/web-tree-sitter@0.20.8/tree-sitter.js"
  integrity="sha384-VSNUlp0XiZdJhmV1CPdCC5JHRB+IhWJmPCQCrCvDzMEWvyCgIhb8+c+560yaAQHC" crossorigin="anonymous"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Unity Block Coder <small style="font-weight:400;opacity:.6">ブロック → C#</small></h1>
  <button id="undo" title="取り消し (Ctrl+Z)">↶ 取り消し</button>
  <button id="redo" title="やり直し (Ctrl+Y / Ctrl+Shift+Z)">↷ やり直し</button>
  <button id="import">C# 読込</button>
  <button id="sample">サンプル読込</button>
  <button id="clear">全消去</button>
</header>
<dialog id="importDlg">
  <h2>C# を読み込んでブロックに変換</h2>
  <textarea id="importSrc" spellcheck="false" placeholder="ここに C# コードを貼り付けるか、ファイルを選んでください"></textarea>
  <div class="row"><input type="file" id="importFile" accept=".cs,text/plain"><label><input type="checkbox" id="importAppend"> 今のブロックに追加する</label></div>
  <p id="importMsg"></p>
  <div class="row end"><button id="importCancel">キャンセル</button><button id="importGo" class="primary">ブロックに変換</button></div>
</dialog>
<dialog id="reqDlg">
  <h2>ブロック追加の依頼文</h2>
  <p class="hint">この文章をコピーして Claude のセッションに貼り付けると、足りないブロックをまとめて追加できます。</p>
  <textarea id="reqText" readonly spellcheck="false"></textarea>
  <div class="row end"><button id="reqClose">閉じる</button><button id="reqSave">.md 保存</button><button id="reqCopy" class="primary">コピー</button></div>
</dialog>
<div id="toast" hidden></div>
<main>
  <div id="blocks"></div>
  <div id="side">
    <div class="bar"><span id="fname">Script.cs</span><b id="status"></b><button id="copy">コピー</button><button id="dl" class="primary">.cs 保存</button></div>
    <pre id="code"></pre>
    <div class="tabs"><button id="tabIssues" class="on">問題</button><button id="tabLog">読み込みログ</button></div>
    <div id="issues"></div>
    <div id="importLog" hidden><div id="collectBar" hidden></div><div id="logBody"><div class="ok"><small>C# を読み込むと、ブロック化できなかった箇所と足りないブロックがここに表示されます</small></div></div></div>
  </div>
</main>
<script src="js/blocks.js"></script>
<script src="js/generator.js"></script>
<script src="js/toolbox.js"></script>
<script src="js/types.js"></script>
<script src="js/checker.js"></script>
<script src="js/autocomplete.js"></script>
<script src="js/importer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
