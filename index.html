<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity Block Coder</title>
<script src="https://unpkg.com/blockly@11.1.1/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.1.1/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.1.1/msg/ja.js"></script>
<script src="https://unpkg.com/web-tree-sitter@0.20.8/tree-sitter.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --fg: #1d1f23; --panel: #ffffff; --border: #d8dbe0; --accent: #3b6fd8;
    --code-bg: #1e1f24; --code-fg: #d8dae0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16171a; --fg: #e6e7ea; --panel: #202226; --border: #34373d; --accent: #6b95ea; }
  }
  :root[data-theme="dark"] { --bg: #16171a; --fg: #e6e7ea; --panel: #202226; --border: #34373d; --accent: #6b95ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; display: flex; min-height: 0; }
  #blocks { flex: 1 1 60%; min-width: 0; }
  #side { flex: 1 1 40%; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--border); background: var(--code-bg); }
  #side .bar { display: flex; gap: 6px; padding: 8px; align-items: center; color: var(--code-fg); font-size: 13px; }
  #side .bar span { margin-right: auto; }
  #status { font-size: 12px; font-weight: 600; }
  pre { counter-reset: ln; }
  .ln { display: block; min-height: 1.55em; }
  .ln::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 2.2em; margin-right: 1em; text-align: right; color: #5c6370; }
  .ln.err { background: rgba(255, 90, 90, .16); }
  .tabs { display: flex; border-top: 1px solid #34373d; }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; color: #8b919c; font-size: 12px; padding: 6px; }
  .tabs button.on { color: var(--code-fg); box-shadow: inset 0 -2px 0 var(--accent); }
  #importLog { max-height: 32%; overflow: auto; font-size: 13px; color: var(--code-fg); }
  #logBody > div, #collectBar { padding: 5px 12px; border-bottom: 1px solid #2a2c32; }
  #collectBar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; background: #262830; z-index: 1; }
  #collectBar button { font-size: 11px; padding: 3px 10px; }
  #collectBar button:not(.primary) { background: transparent; color: var(--code-fg); border-color: #4a4e57; }
  dialog .hint { font-size: 13px; opacity: .75; margin: 0 0 8px; }
  #importLog .log-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #importLog .log-head button { font-size: 11px; padding: 2px 8px; background: transparent; color: var(--code-fg); border-color: #4a4e57; }
  #importLog .log-sec { font-size: 11px; color: #8b919c; padding-top: 8px; }
  #importLog .log-need small { color: #8b919c; margin-left: 4px; }
  #importLog code { display: block; margin-top: 2px; font: 12px ui-monospace, Consolas, monospace; color: #9aa3b2; overflow-wrap: anywhere; }
  #issues { max-height: 32%; overflow: auto; border-top: 1px solid #34373d; font-size: 13px; color: var(--code-fg); }
  #issues > div { padding: 6px 12px; border-bottom: 1px solid #2a2c32; }
  .issue { cursor: pointer; } .issue:hover { background: #2a2c32; }
  .issue.error b { color: #ff6b6b; } .issue.warn b { color: #f5c04a; } .ok { color: #7bd88f; }
  .issue small, .ok small { opacity: .6; margin-left: 6px; }
  #ac { position: fixed; z-index: 100000; min-width: 220px; max-width: 360px; max-height: 260px; overflow: auto; background: var(--panel); color: var(--fg);
        border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font: 13px ui-monospace, Consolas, monospace; }
  .ac-item { display: flex; justify-content: space-between; gap: 12px; padding: 4px 10px; cursor: pointer; }
  .ac-item small { opacity: .6; white-space: nowrap; }
  .ac-item.sel { background: var(--accent); color: #fff; }
  dialog { width: min(760px, calc(100vw - 32px)); background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { font-size: 16px; margin: 0 0 12px; }
  dialog textarea { width: 100%; height: min(50vh, 420px); resize: vertical; font: 13px/1.5 ui-monospace, Consolas, monospace; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; tab-size: 4; }
  dialog .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  dialog .row.end { justify-content: flex-end; }
  #importMsg { color: #e5534b; font-size: 13px; min-height: 1em; margin: 8px 0 0; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(640px, calc(100vw - 32px)); background: var(--panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 1000; white-space: pre-line; }
  .ac-hint { padding: 4px 10px; font: 11px system-ui, sans-serif; opacity: .6; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--panel); }
  pre { margin: 0; padding: 12px 16px; flex: 1; overflow: auto; color: var(--code-fg); font: 13px/1.55 ui-monospace, Consolas, "Cascadia Code", monospace; tab-size: 4; }
  .k { color: #6fa8ff; } .t { color: #4ec9b0; } .s { color: #e5a46b; } .n { color: #b5cea8; } .c { color: #6a9955; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #blocks { flex: 1 1 60%; min-height: 320px; }
    #side { flex: 1 1 40%; border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>Unity Block Coder <small style="font-weight:400;opacity:.6">ブロック → C#</small></h1>
  <button id="undo" title="取り消し (Ctrl+Z)">↶ 取り消し</button>
  <button id="redo" title="やり直し (Ctrl+Y / Ctrl+Shift+Z)">↷ やり直し</button>
  <button id="import">C# 読込</button>
  <button id="sample">サンプル読込</button>
  <button id="clear">全消去</button>
</header>
<dialog id="importDlg">
  <h2>C# を読み込んでブロックに変換</h2>
  <textarea id="importSrc" spellcheck="false" placeholder="ここに C# コードを貼り付けるか、ファイルを選んでください"></textarea>
  <div class="row"><input type="file" id="importFile" accept=".cs,text/plain"><label><input type="checkbox" id="importAppend"> 今のブロックに追加する</label></div>
  <p id="importMsg"></p>
  <div class="row end"><button id="importCancel">キャンセル</button><button id="importGo" class="primary">ブロックに変換</button></div>
</dialog>
<dialog id="reqDlg">
  <h2>ブロック追加の依頼文</h2>
  <p class="hint">この文章をコピーして Claude のセッションに貼り付けると、足りないブロックをまとめて追加できます。</p>
  <textarea id="reqText" readonly spellcheck="false"></textarea>
  <div class="row end"><button id="reqClose">閉じる</button><button id="reqSave">.md 保存</button><button id="reqCopy" class="primary">コピー</button></div>
</dialog>
<div id="toast" hidden></div>
<main>
  <div id="blocks"></div>
  <div id="side">
    <div class="bar"><span id="fname">Script.cs</span><b id="status"></b><button id="copy">コピー</button><button id="dl" class="primary">.cs 保存</button></div>
    <pre id="code"></pre>
    <div class="tabs"><button id="tabIssues" class="on">問題</button><button id="tabLog">読み込みログ</button></div>
    <div id="issues"></div>
    <div id="importLog" hidden><div id="collectBar" hidden></div><div id="logBody"><div class="ok"><small>C# を読み込むと、ブロック化できなかった箇所と足りないブロックがここに表示されます</small></div></div></div>
  </div>
</main>
<script>
// ---------- ブロック定義 ----------
const C = { cls: 290, var: 330, unity: 20, list: 260, misc: 0 };
// 修飾子。'none' は修飾子なし (ドロップダウンでは「(なし)」)
const opt = a => [a === 'none' ? '(なし)' : a, a];
const ACCESS = [...['public', 'private', 'protected', 'internal', ''].flatMap(a => ['', 'static', 'readonly', 'static readonly', 'const'].map(x => [a, x].filter(Boolean).join(' ') || 'none')),
  '[SerializeField]', '[SerializeField] private', '[SerializeField] protected'].map(opt);
const METHOD_ACCESS = ['public', 'private', 'protected', 'internal', 'none', 'static', 'public static', 'private static', 'protected static',
  'public override', 'protected override', 'public virtual', 'protected virtual'];
const PROP_ACCESS = ['public', 'private', 'protected', 'internal', 'none', 'static', 'public static', 'private static'];
const EVENTS = ['Awake()','Start()','Update()','FixedUpdate()','LateUpdate()','OnEnable()','OnDisable()','OnDestroy()',
  'OnCollisionEnter(Collision collision)','OnCollisionExit(Collision collision)','OnTriggerEnter(Collider other)','OnTriggerStay(Collider other)',
  'OnTriggerExit(Collider other)','OnMouseDown()', 'OnCollisionStay(Collision collision)', 'OnMouseUp()', 'OnBecameVisible()', 'OnBecameInvisible()'];
const MEMBER = { previousStatement: 'Member', nextStatement: 'Member' };
const STMT = { previousStatement: null, nextStatement: null };

Blockly.defineBlocksWithJsonArray([
  // クラス
  { type: 'class_def', message0: '%1 %2 class %3 : %4', message1: '%1', colour: C.cls,
    args0: [{ type: 'field_checkbox', name: 'SER', checked: false }, { type: 'field_dropdown', name: 'ACCESS', options: [['public','public'],['internal','internal']] },
            { type: 'field_input', name: 'NAME', text: 'MyClass' }, { type: 'field_ac', ac: 'base', name: 'BASE', text: 'MonoBehaviour' }],
    args1: [{ type: 'input_statement', name: 'MEMBERS', check: 'Member' }],
    tooltip: 'クラス定義。チェックで [System.Serializable]、継承元を空にすると通常クラス' },
  { type: 'field_def', message0: 'フィールド %1 %2 %3 = %4', colour: C.cls, ...MEMBER, inputsInline: true,
    args0: [{ type: 'field_dropdown', name: 'ACCESS', options: ACCESS }, { type: 'field_ac', ac: 'type', name: 'TYPE', text: 'float' },
            { type: 'field_input', name: 'NAME', text: 'speed' }, { type: 'input_value', name: 'VALUE' }],
    tooltip: '型は自由入力 (int, float, string, GameObject, List<Item> など)。値は省略可' },
  { type: 'method_def', message0: 'メソッド %1 %2 %3 ( %4 )', message1: '%1', colour: C.cls, ...MEMBER,
    args0: [{ type: 'field_dropdown', name: 'ACCESS', options: METHOD_ACCESS.map(opt) }, { type: 'field_ac', ac: 'type', name: 'RET', text: 'void' },
            { type: 'field_input', name: 'NAME', text: 'MyMethod' }, { type: 'field_ac', ac: 'params', name: 'PARAMS', text: '' }],
    args1: [{ type: 'input_statement', name: 'BODY' }], tooltip: '引数は「int a, string b」のように入力' },
  { type: 'unity_event', message0: 'Unityイベント %1', message1: '%1', colour: C.unity, ...MEMBER,
    args0: [{ type: 'field_dropdown', name: 'EVENT', options: EVENTS.map(e => [e, e]) }],
    args1: [{ type: 'input_statement', name: 'BODY' }] },
  { type: 'new_object', message0: 'new %1 ( %2 )', output: null, colour: C.cls,
    args0: [{ type: 'field_ac', ac: 'class', name: 'NAME', text: 'MyClass' }, { type: 'field_ac', ac: 'var', name: 'ARGS', text: '' }] },
  { type: 'return_stmt', message0: 'return %1', previousStatement: null, colour: C.cls, args0: [{ type: 'input_value', name: 'VALUE' }] },
  { type: 'method_call', message0: '呼び出し %1 ( %2 )', colour: C.cls, ...STMT,
    args0: [{ type: 'field_ac', ac: 'method', name: 'NAME', text: 'MyMethod' }, { type: 'field_ac', ac: 'var', name: 'ARGS', text: '' }] },
  { type: 'method_call_expr', message0: '%1 ( %2 )', output: null, colour: C.cls,
    args0: [{ type: 'field_ac', ac: 'method', name: 'NAME', text: 'MyMethod' }, { type: 'field_ac', ac: 'var', name: 'ARGS', text: '' }] },
  // 変数
  { type: 'var_local', message0: '変数 %1 %2 = %3', colour: C.var, ...STMT, inputsInline: true,
    args0: [{ type: 'field_ac', ac: 'type', name: 'TYPE', text: 'int' }, { type: 'field_input', name: 'NAME', text: 'x' }, { type: 'input_value', name: 'VALUE' }] },
  { type: 'var_set', message0: '%1 %2 %3', colour: C.var, ...STMT, inputsInline: true,
    args0: [{ type: 'field_ac', ac: 'var', name: 'NAME', text: 'x' }, { type: 'field_dropdown', name: 'OP', options: ['=','+=','-=','*=','/='].map(o => [o, o]) },
            { type: 'input_value', name: 'VALUE' }] },
  { type: 'var_get', message0: '%1', output: null, colour: C.var, args0: [{ type: 'field_ac', ac: 'var', name: 'NAME', text: 'x' }],
    tooltip: '変数名。item.itemName のようなメンバー参照も可' },
  { type: 'for_range', message0: 'for int %1 = %2 ～ %3 未満', message1: '%1', colour: 120, ...STMT, inputsInline: true,
    args0: [{ type: 'field_input', name: 'VAR', text: 'i' }, { type: 'input_value', name: 'FROM', check: 'Number' }, { type: 'input_value', name: 'TO' }],
    args1: [{ type: 'input_statement', name: 'DO' }] },
  // リスト
  { type: 'list_new', message0: 'new List< %1 >()', output: null, colour: C.list, args0: [{ type: 'field_ac', ac: 'type', name: 'TYPE', text: 'int' }] },
  { type: 'list_add', message0: '%1 .Add( %2 )', colour: C.list, ...STMT, inputsInline: true,
    args0: [{ type: 'input_value', name: 'LIST' }, { type: 'input_value', name: 'VALUE' }] },
  { type: 'list_remove', message0: '%1 . %2 ( %3 )', colour: C.list, ...STMT, inputsInline: true,
    args0: [{ type: 'input_value', name: 'LIST' }, { type: 'field_dropdown', name: 'OP', options: [['Remove','Remove'],['RemoveAt','RemoveAt']] }, { type: 'input_value', name: 'VALUE' }] },
  { type: 'list_clear', message0: '%1 .Clear()', colour: C.list, ...STMT, args0: [{ type: 'input_value', name: 'LIST' }] },
  { type: 'list_get', message0: '%1 [ %2 ]', output: null, colour: C.list, inputsInline: true,
    args0: [{ type: 'input_value', name: 'LIST' }, { type: 'input_value', name: 'INDEX' }] },
  { type: 'list_set', message0: '%1 [ %2 ] = %3', colour: C.list, ...STMT, inputsInline: true,
    args0: [{ type: 'input_value', name: 'LIST' }, { type: 'input_value', name: 'INDEX' }, { type: 'input_value', name: 'VALUE' }] },
  { type: 'list_count', message0: '%1 .Count', output: 'Number', colour: C.list, args0: [{ type: 'input_value', name: 'LIST' }] },
  { type: 'list_contains', message0: '%1 .Contains( %2 )', output: 'Boolean', colour: C.list, inputsInline: true,
    args0: [{ type: 'input_value', name: 'LIST' }, { type: 'input_value', name: 'VALUE' }] },
  { type: 'list_foreach', message0: 'foreach %1 %2 in %3', message1: '%1', colour: C.list, ...STMT,
    args0: [{ type: 'field_ac', ac: 'type', name: 'TYPE', text: 'var' }, { type: 'field_input', name: 'VAR', text: 'item' }, { type: 'input_value', name: 'LIST' }],
    args1: [{ type: 'input_statement', name: 'DO' }] },
  // Unity
  { type: 'debug_log', message0: 'Debug. %1 ( %2 )', colour: C.unity, ...STMT,
    args0: [{ type: 'field_dropdown', name: 'LEVEL', options: [['Log','Log'],['LogWarning','LogWarning'],['LogError','LogError']] }, { type: 'input_value', name: 'MSG' }] },
  { type: 'vector3_new', message0: 'Vector3 ( %1 , %2 , %3 )', output: null, colour: C.unity, inputsInline: true,
    args0: [{ type: 'input_value', name: 'X' }, { type: 'input_value', name: 'Y' }, { type: 'input_value', name: 'Z' }] },
  { type: 'vector3_const', message0: 'Vector3. %1', output: null, colour: C.unity,
    args0: [{ type: 'field_dropdown', name: 'DIR', options: ['zero','one','up','down','left','right','forward','back'].map(d => [d, d]) }] },
  { type: 'time_value', message0: 'Time. %1', output: 'Number', colour: C.unity,
    args0: [{ type: 'field_dropdown', name: 'PROP', options: ['deltaTime','time','fixedDeltaTime','timeScale','unscaledDeltaTime'].map(d => [d, d]) }] },
  { type: 'input_key', message0: 'Input. %1 ( KeyCode. %2 )', output: 'Boolean', colour: C.unity,
    args0: [{ type: 'field_dropdown', name: 'MODE', options: ['GetKey','GetKeyDown','GetKeyUp'].map(d => [d, d]) },
            { type: 'field_dropdown', name: 'KEY', options: ['Space','Return','Escape','LeftShift','W','A','S','D','UpArrow','DownArrow','LeftArrow','RightArrow','Mouse0'].map(d => [d, d]) }] },
  { type: 'input_axis', message0: 'Input.GetAxis( %1 )', output: 'Number', colour: C.unity,
    args0: [{ type: 'field_dropdown', name: 'AXIS', options: ['Horizontal','Vertical','Mouse X','Mouse Y','Jump'].map(d => [d, d]) }] },
  { type: 'transform_action', message0: 'transform. %1 ( %2 )', colour: C.unity, ...STMT,
    args0: [{ type: 'field_dropdown', name: 'ACTION', options: [['Translate','Translate'],['Rotate','Rotate'],['LookAt','LookAt']] }, { type: 'input_value', name: 'VEC' }] },
  { type: 'transform_set', message0: 'transform. %1 = %2', colour: C.unity, ...STMT,
    args0: [{ type: 'field_dropdown', name: 'PROP', options: ['position','localPosition','localScale','eulerAngles'].map(d => [d, d]) }, { type: 'input_value', name: 'VALUE' }] },
  { type: 'transform_get', message0: 'transform. %1', output: null, colour: C.unity,
    args0: [{ type: 'field_dropdown', name: 'PROP', options: ['position','rotation','localScale','forward','right','up'].map(d => [d, d]) }] },
  { type: 'get_component', message0: 'GetComponent< %1 >()', output: null, colour: C.unity, args0: [{ type: 'field_ac', ac: 'component', name: 'TYPE', text: 'Rigidbody' }] },
  { type: 'instantiate', message0: 'Instantiate( %1 , %2 , Quaternion.identity )', output: null, colour: C.unity, inputsInline: true,
    args0: [{ type: 'input_value', name: 'PREFAB' }, { type: 'input_value', name: 'POS' }] },
  { type: 'destroy', message0: 'Destroy( %1 ) 遅延 %2 秒', colour: C.unity, ...STMT, inputsInline: true,
    args0: [{ type: 'input_value', name: 'OBJ' }, { type: 'input_value', name: 'DELAY' }], tooltip: '遅延は省略可' },
  { type: 'random_range', message0: 'Random.Range( %1 , %2 )', output: 'Number', colour: 230, inputsInline: true,
    args0: [{ type: 'input_value', name: 'A' }, { type: 'input_value', name: 'B' }] },
  { type: 'text_concat', message0: '%1 + %2', output: null, colour: 160, inputsInline: true,
    args0: [{ type: 'input_value', name: 'A' }, { type: 'input_value', name: 'B' }], tooltip: '文字列の連結など (型チェックなしの +)' },
  // クラス (追加)
  { type: 'enum_def', message0: 'enum %1 { %2 }', colour: C.cls,
    args0: [{ type: 'field_input', name: 'NAME', text: 'State' }, { type: 'field_input', name: 'VALUES', text: 'Idle, Run, Jump' }], tooltip: '列挙型。値はカンマ区切り' },
  { type: 'property_def', message0: 'プロパティ %1 %2 %3 { %4 }', colour: C.cls, ...MEMBER,
    args0: [{ type: 'field_dropdown', name: 'ACCESS', options: PROP_ACCESS.map(opt) }, { type: 'field_ac', ac: 'type', name: 'TYPE', text: 'int' },
            { type: 'field_input', name: 'NAME', text: 'Hp' }, { type: 'field_dropdown', name: 'ACC', options: ['get; set;', 'get; private set;', 'get;'].map(d => [d, d]) }] },
  { type: 'constructor_def', message0: 'コンストラクター ( %1 )', message1: '%1', colour: C.cls, ...MEMBER,
    args0: [{ type: 'field_ac', ac: 'params', name: 'PARAMS', text: '' }], args1: [{ type: 'input_statement', name: 'BODY' }],
    tooltip: 'new したときに実行される処理。名前はクラス名になります' },
  // コルーチン
  { type: 'coroutine_def', message0: 'コルーチン IEnumerator %1 ( %2 )', message1: '%1', colour: 65, ...MEMBER,
    args0: [{ type: 'field_input', name: 'NAME', text: 'Routine' }, { type: 'field_ac', ac: 'params', name: 'PARAMS', text: '' }], args1: [{ type: 'input_statement', name: 'BODY' }] },
  { type: 'yield_wait', message0: 'yield return new WaitForSeconds( %1 )', colour: 65, ...STMT, args0: [{ type: 'input_value', name: 'SEC' }] },
  { type: 'yield_null', message0: 'yield return null (1フレーム待つ)', colour: 65, ...STMT },
  { type: 'start_coroutine', message0: 'StartCoroutine( %1 () )', colour: 65, ...STMT, args0: [{ type: 'field_ac', ac: 'method', name: 'NAME', text: 'Routine' }] },
  { type: 'invoke_stmt', message0: 'Invoke( %1 , %2 秒後 )', colour: 65, ...STMT, inputsInline: true,
    args0: [{ type: 'field_ac', ac: 'method', name: 'NAME', text: 'MyMethod' }, { type: 'input_value', name: 'SEC' }] },
  // 制御 (追加)
  { type: 'switch_stmt', message0: 'switch ( %1 )', message1: '%1', colour: 210, ...STMT,
    args0: [{ type: 'input_value', name: 'VALUE' }], args1: [{ type: 'input_statement', name: 'CASES', check: 'Case' }] },
  { type: 'case_clause', message0: 'case %1 :', message1: '%1', colour: 210, previousStatement: 'Case', nextStatement: 'Case',

// ---------- C# ジェネレーター ----------
const O = { ATOMIC: 0, MEMBER: 1, UNARY: 2, MULT: 3, ADD: 4, REL: 5, EQ: 6, AND: 7, OR: 8, COND: 9, ASSIGN: 10, NONE: 99 };
const cs = new Blockly.CodeGenerator('CSharp');
cs.INDENT = '    ';
cs.ORDER_OVERRIDES = [[O.MEMBER, O.MEMBER]];
cs.init = function () { this.isInitialized = true; this.extraUsings = new Set(); };
cs.finish = function (code) {
  const usings = ['UnityEngine'];
  if (/\b(List|Dictionary)</.test(code)) usings.unshift('System.Collections.Generic');
  if (/\bIEnumerator\b/.test(code)) usings.unshift('System.Collections');
  if (/\bSceneManager\./.test(code)) usings.push('UnityEngine.SceneManagement');
  if (/\b(Text|Image|Slider|Button|Toggle)\b/.test(code)) usings.push('UnityEngine.UI');
  if (/\b(TextMeshProUGUI|TMP_Text)\b/.test(code)) usings.push('TMPro');
  this.extraUsings.forEach(u => { if (u && !usings.includes(u)) usings.push(u); });
  return (usings.map(u => `using ${u};`).join('\n') + '\n\n' + code).replace(/[ \t]+$/gm, '');
};
cs.scrub_ = function (block, code, thisOnly) {
  const next = block.nextConnection && block.nextConnection.targetBlock();
  return code + (next && !thisOnly ? this.blockToCode(next) : '');
};
cs.scrubNakedValue = line => `// 未接続の式: ${line}\n`;

const f = (b, n) => b.getFieldValue(n);
const v = (b, n, o, d = '') => cs.valueToCode(b, n, o) || d;
const st = (b, n) => cs.statementToCode(b, n);
const block = (head, b, n) => `${head}\n{\n${st(b, n)}}\n`;
const lit = t => '"' + t.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
const gap = b => { const p = b.getPreviousBlock(); return p && p.type !== 'class_def' ? '\n' : ''; };
const G = cs.forBlock;

G.class_def = b => {
  const base = f(b, 'BASE').trim();
  return (f(b, 'SER') === 'TRUE' ? '[System.Serializable]\n' : '') + block(`${f(b, 'ACCESS')} class ${f(b, 'NAME')}${base ? ' : ' + base : ''}`, b, 'MEMBERS');
};
const mod = a => a === 'none' ? '' : a + ' ';
G.field_def = b => { const val = v(b, 'VALUE', O.ASSIGN); return `${mod(f(b, 'ACCESS'))}${f(b, 'TYPE')} ${f(b, 'NAME')}${val ? ' = ' + val : ''};\n`; };
G.method_def = b => gap(b) + block(`${mod(f(b, 'ACCESS'))}${f(b, 'RET')} ${f(b, 'NAME')}(${f(b, 'PARAMS')})`, b, 'BODY');
G.unity_event = b => gap(b) + block(`void ${f(b, 'EVENT')}`, b, 'BODY');
G.new_object = b => [`new ${f(b, 'NAME')}(${f(b, 'ARGS')})`, O.MEMBER];
G.return_stmt = b => { const val = v(b, 'VALUE', O.NONE); return val ? `return ${val};\n` : 'return;\n'; };
G.method_call = b => `${f(b, 'NAME')}(${f(b, 'ARGS')});\n`;
G.method_call_expr = b => [`${f(b, 'NAME')}(${f(b, 'ARGS')})`, O.MEMBER];

G.var_local = b => { const val = v(b, 'VALUE', O.ASSIGN); return `${f(b, 'TYPE')} ${f(b, 'NAME')}${val ? ' = ' + val : ''};\n`; };
G.var_set = b => `${f(b, 'NAME')} ${f(b, 'OP')} ${v(b, 'VALUE', O.ASSIGN, 'default')};\n`;
G.var_get = b => [f(b, 'NAME'), O.ATOMIC];

G.list_new = b => [`new List<${f(b, 'TYPE')}>()`, O.MEMBER];
G.list_add = b => `${v(b, 'LIST', O.MEMBER, 'list')}.Add(${v(b, 'VALUE', O.NONE, 'default')});\n`;
G.list_remove = b => `${v(b, 'LIST', O.MEMBER, 'list')}.${f(b, 'OP')}(${v(b, 'VALUE', O.NONE, '0')});\n`;
G.list_clear = b => `${v(b, 'LIST', O.MEMBER, 'list')}.Clear();\n`;
G.list_get = b => [`${v(b, 'LIST', O.MEMBER, 'list')}[${v(b, 'INDEX', O.NONE, '0')}]`, O.MEMBER];
G.list_set = b => `${v(b, 'LIST', O.MEMBER, 'list')}[${v(b, 'INDEX', O.NONE, '0')}] = ${v(b, 'VALUE', O.ASSIGN, 'default')};\n`;
G.list_count = b => [`${v(b, 'LIST', O.MEMBER, 'list')}.Count`, O.MEMBER];
G.list_contains = b => [`${v(b, 'LIST', O.MEMBER, 'list')}.Contains(${v(b, 'VALUE', O.NONE, 'default')})`, O.MEMBER];
G.list_foreach = b => block(`foreach (${f(b, 'TYPE')} ${f(b, 'VAR')} in ${v(b, 'LIST', O.NONE, 'list')})`, b, 'DO');

G.debug_log = b => `Debug.${f(b, 'LEVEL')}(${v(b, 'MSG', O.NONE, '""')});\n`;
G.vector3_new = b => [`new Vector3(${['X', 'Y', 'Z'].map(k => v(b, k, O.NONE, '0')).join(', ')})`, O.MEMBER];
G.vector3_const = b => [`Vector3.${f(b, 'DIR')}`, O.MEMBER];
G.time_value = b => [`Time.${f(b, 'PROP')}`, O.MEMBER];
G.input_key = b => [`Input.${f(b, 'MODE')}(KeyCode.${f(b, 'KEY')})`, O.MEMBER];
G.input_axis = b => [`Input.GetAxis("${f(b, 'AXIS')}")`, O.MEMBER];
G.transform_action = b => `transform.${f(b, 'ACTION')}(${v(b, 'VEC', O.NONE, 'Vector3.zero')});\n`;
G.transform_set = b => `transform.${f(b, 'PROP')} = ${v(b, 'VALUE', O.ASSIGN, 'Vector3.zero')};\n`;
G.transform_get = b => [`transform.${f(b, 'PROP')}`, O.MEMBER];
G.get_component = b => [`GetComponent<${f(b, 'TYPE')}>()`, O.MEMBER];
G.instantiate = b => [`Instantiate(${v(b, 'PREFAB', O.NONE, 'null')}, ${v(b, 'POS', O.NONE, 'Vector3.zero')}, Quaternion.identity)`, O.MEMBER];
G.destroy = b => { const d = v(b, 'DELAY', O.NONE); return `Destroy(${v(b, 'OBJ', O.NONE, 'gameObject')}${d ? ', ' + d : ''});\n`; };
G.random_range = b => [`Random.Range(${v(b, 'A', O.NONE, '0')}, ${v(b, 'B', O.NONE, '1')})`, O.MEMBER];
G.expr_stmt = b => `${v(b, 'EXPR', O.NONE, '')};\n`;
G.raw_stmt = b => f(b, 'CODE') + '\n';
G.raw_expr = b => [f(b, 'CODE'), O.ATOMIC];

const L = b => v(b, 'LIST', O.MEMBER, 'list');
const ownerClass = b => { for (let p = b.getSurroundParent(); p; p = p.getSurroundParent()) if (p.type === 'class_def') return f(p, 'NAME'); return 'MyClass'; };
const caseBody = b => {
  let last = b.getInputTargetBlock('DO');
  while (last && last.getNextBlock()) last = last.getNextBlock();
  return st(b, 'DO') + (last && ['controls_flow_statements', 'return_stmt'].includes(last.type) ? '' : cs.INDENT + 'break;\n');
};
G.enum_def = b => `public enum ${f(b, 'NAME')}\n{\n${f(b, 'VALUES').split(',').map(s => s.trim()).filter(Boolean).map(s => cs.INDENT + s).join(',\n')}\n}\n`;
G.property_def = b => `${mod(f(b, 'ACCESS'))}${f(b, 'TYPE')} ${f(b, 'NAME')} { ${f(b, 'ACC')} }\n`;
G.constructor_def = b => gap(b) + block(`public ${ownerClass(b)}(${f(b, 'PARAMS')})`, b, 'BODY');
G.coroutine_def = b => gap(b) + block(`IEnumerator ${f(b, 'NAME')}(${f(b, 'PARAMS')})`, b, 'BODY');
G.yield_wait = b => `yield return new WaitForSeconds(${v(b, 'SEC', O.NONE, '1')});\n`;
G.yield_null = () => 'yield return null;\n';
G.start_coroutine = b => `StartCoroutine(${f(b, 'NAME')}());\n`;
G.invoke_stmt = b => `Invoke(${lit(f(b, 'NAME'))}, ${v(b, 'SEC', O.NONE, '0')});\n`;
G.switch_stmt = b => block(`switch (${v(b, 'VALUE', O.NONE, '0')})`, b, 'CASES');
G.case_clause = b => `case ${f(b, 'VALUE')}:\n${caseBody(b)}`;
G.default_clause = b => `default:\n${caseBody(b)}`;
G.var_incr = b => `${f(b, 'NAME')}${f(b, 'OP')};\n`;
G.cast_expr = b => [`(${f(b, 'TYPE')})${v(b, 'VALUE', O.UNARY, '0')}`, O.UNARY];
G.to_string = b => [`${v(b, 'VALUE', O.MEMBER, '0')}.ToString()`, O.MEMBER];
G.math_func1 = b => [`Mathf.${f(b, 'FN')}(${v(b, 'X', O.NONE, '0')})`, O.MEMBER];
G.math_func2 = b => [`Mathf.${f(b, 'FN')}(${v(b, 'A', O.NONE, '0')}, ${v(b, 'B', O.NONE, '0')})`, O.MEMBER];
G.math_func3 = b => [`Mathf.${f(b, 'FN')}(${['A', 'B', 'C'].map(k => v(b, k, O.NONE, '0')).join(', ')})`, O.MEMBER];
G.math_modulo = b => [`${v(b, 'DIVIDEND', O.MULT + 1, '0')} % ${v(b, 'DIVISOR', O.MULT, '1')}`, O.MULT];
G.logic_ternary = b => [`${v(b, 'IF', O.COND, 'false')} ? ${v(b, 'THEN', O.COND, 'default')} : ${v(b, 'ELSE', O.COND, 'default')}`, O.COND];
G.vector3_func = b => [`Vector3.${f(b, 'FN')}(${v(b, 'A', O.NONE, 'Vector3.zero')}, ${v(b, 'B', O.NONE, 'Vector3.zero')})`, O.MEMBER];
G.vector3_lerp = b => [`Vector3.${f(b, 'FN')}(${v(b, 'A', O.NONE, 'Vector3.zero')}, ${v(b, 'B', O.NONE, 'Vector3.zero')}, ${v(b, 'C', O.NONE, '0')})`, O.MEMBER];
G.quaternion_euler = b => [`Quaternion.Euler(${['X', 'Y', 'Z'].map(k => v(b, k, O.NONE, '0')).join(', ')})`, O.MEMBER];
G.color_const = b => [`Color.${f(b, 'COLOR')}`, O.MEMBER];
G.rb_addforce = b => `${v(b, 'RB', O.MEMBER, 'GetComponent<Rigidbody>()')}.AddForce(${v(b, 'VEC', O.NONE, 'Vector3.up')}, ForceMode.${f(b, 'MODE')});\n`;
G.set_active = b => `${v(b, 'OBJ', O.MEMBER, 'gameObject')}.SetActive(${v(b, 'BOOL', O.NONE, 'true')});\n`;
G.compare_tag = b => [`${v(b, 'OBJ', O.MEMBER, 'gameObject')}.CompareTag(${lit(f(b, 'TAG'))})`, O.MEMBER];
G.find_object = b => [`GameObject.${f(b, 'FN')}(${lit(f(b, 'NAME'))})`, O.MEMBER];
G.add_component = b => [`gameObject.AddComponent<${f(b, 'TYPE')}>()`, O.MEMBER];
G.mouse_button = b => [`Input.${f(b, 'MODE')}(${f(b, 'BTN')})`, O.MEMBER];
G.load_scene = b => `SceneManager.LoadScene(${v(b, 'SCENE', O.NONE, '0')});\n`;
G.list_insert = b => `${L(b)}.Insert(${v(b, 'INDEX', O.NONE, '0')}, ${v(b, 'VALUE', O.NONE, 'default')});\n`;
G.list_index_of = b => [`${L(b)}.IndexOf(${v(b, 'VALUE', O.NONE, 'default')})`, O.MEMBER];
G.list_order = b => `${L(b)}.${f(b, 'OP')}();\n`;
G.dict_new = b => [`new Dictionary<${f(b, 'KEY')}, ${f(b, 'VAL')}>()`, O.MEMBER];
G.dict_add = b => `${L(b)}.Add(${v(b, 'KEY', O.NONE, 'default')}, ${v(b, 'VALUE', O.NONE, 'default')});\n`;
G.dict_contains = b => [`${L(b)}.ContainsKey(${v(b, 'KEY', O.NONE, 'default')})`, O.MEMBER];

G.raycast_if = b => block(`if (Physics.Raycast(${v(b, 'ORIGIN', O.NONE, 'transform.position')}, ${v(b, 'DIR', O.NONE, 'transform.forward')}, out RaycastHit ${f(b, 'HIT')}, ${v(b, 'DIST', O.NONE, '100')}))`, b, 'DO');

G.hit_get = b => [`${f(b, 'HIT')}.${f(b, 'PROP')}`, O.MEMBER];

G.number_f = b => { const n = Number(f(b, 'NUM')); return [n + 'f', n < 0 ? O.UNARY : O.ATOMIC]; };

G.new_object_init = b => {
  const items = [], args = f(b, 'ARGS').trim();
  for (let c = b.getInputTargetBlock('INITS'); c; c = c.getNextBlock()) if (c.type === 'init_assign') items.push(`${f(c, 'NAME')} = ${v(c, 'VALUE', O.ASSIGN, 'default')}`);
  return [`new ${f(b, 'NAME')}${args ? `(${args})` : ''} { ${items.join(', ')}${items.length ? ' ' : ''}}`, O.MEMBER];
};
G.init_assign = () => '';
G.generic_call = b => { const o = v(b, 'OBJ', O.MEMBER); return [`${o ? o + '.' : ''}${f(b, 'NAME')}<${f(b, 'TYPE')}>(${f(b, 'ARGS')})`, O.MEMBER]; };
G.call_on = b => [`${v(b, 'OBJ', O.MEMBER, 'this')}.${f(b, 'NAME')}(${f(b, 'ARGS')})`, O.MEMBER];
G.tuple2 = b => [`(${v(b, 'A', O.NONE, 'default')}, ${v(b, 'B', O.NONE, 'default')})`, O.ATOMIC];

G.switch_expr = b => {
  const arms = [];
  for (let c = b.getInputTargetBlock('ARMS'); c; c = c.getNextBlock()) if (c.type === 'switch_arm') arms.push(`${cs.INDENT}${f(c, 'PATTERN')} => ${v(c, 'VALUE', O.NONE, 'default')},`);
  return [`${v(b, 'VALUE', O.MEMBER, 'x')} switch\n{\n${arms.join('\n')}\n}`, O.COND];
};
G.switch_arm = () => '';
G.array_new = b => [`new ${f(b, 'TYPE')}[${v(b, 'SIZE', O.NONE, '0')}]`, O.MEMBER];

// 標準ブロック
G.controls_if = b => {
  let code = '', n = 0;
  while (b.getInput('IF' + n)) {
    code += block(`${n ? 'else if' : 'if'} (${v(b, 'IF' + n, O.NONE, 'false')})`, b, 'DO' + n);
    n++;
  }
  if (b.getInput('ELSE')) code += block('else', b, 'ELSE');
  return code;
};
G.logic_compare = b => {
  const op = { EQ: '==', NEQ: '!=', LT: '<', LTE: '<=', GT: '>', GTE: '>=' }[f(b, 'OP')];
  const o = op.length === 2 && op[0] !== '<' && op[0] !== '>' ? O.EQ : O.REL;
  return [`${v(b, 'A', o, '0')} ${op} ${v(b, 'B', o, '0')}`, o];
};
G.logic_operation = b => {
  const and = f(b, 'OP') === 'AND', o = and ? O.AND : O.OR;
  return [`${v(b, 'A', o, 'false')} ${and ? '&&' : '||'} ${v(b, 'B', o, 'false')}`, o];
};
G.logic_negate = b => [`!${v(b, 'BOOL', O.UNARY, 'true')}`, O.UNARY];
G.logic_boolean = b => [f(b, 'BOOL') === 'TRUE' ? 'true' : 'false', O.ATOMIC];
G.logic_null = () => ['null', O.ATOMIC];
G.math_number = b => { const n = Number(f(b, 'NUM')); return [Number.isInteger(n) ? String(n) : n + 'f', n < 0 ? O.UNARY : O.ATOMIC]; };
G.math_arithmetic = b => {
  const op = f(b, 'OP');
  if (op === 'POWER') return [`Mathf.Pow(${v(b, 'A', O.NONE, '0')}, ${v(b, 'B', O.NONE, '0')})`, O.MEMBER];
  const [sym, o] = { ADD: ['+', O.ADD], MINUS: ['-', O.ADD], MULTIPLY: ['*', O.MULT], DIVIDE: ['/', O.MULT] }[op];
  return [`${v(b, 'A', o + 1, '0')} ${sym} ${v(b, 'B', o, '0')}`, o];
};
G.text_concat = b => [`${v(b, 'A', O.ADD + 1, '""')} + ${v(b, 'B', O.ADD, '""')}`, O.ADD];
G.text = b => [lit(f(b, 'TEXT')), O.ATOMIC];
G.controls_repeat_ext = b => {
  let d = 0;
  for (let p = b.getSurroundParent(); p; p = p.getSurroundParent()) if (p.type === 'controls_repeat_ext') d++;
  const i = 'ijk'[d] || 'i' + d;
  return block(`for (int ${i} = 0; ${i} < ${v(b, 'TIMES', O.REL, '0')}; ${i}++)`, b, 'DO');
};
G.controls_whileUntil = b => {
  const until = f(b, 'MODE') === 'UNTIL';
  const cond = until ? '!' + v(b, 'BOOL', O.UNARY, 'false') : v(b, 'BOOL', O.NONE, 'false');
  return block(`while (${cond})`, b, 'DO');
};
G.for_range = b => { const i = f(b, 'VAR'); return block(`for (int ${i} = ${v(b, 'FROM', O.ASSIGN, '0')}; ${i} < ${v(b, 'TO', O.REL, '0')}; ${i}++)`, b, 'DO'); };
G.controls_flow_statements = b => f(b, 'FLOW') === 'BREAK' ? 'break;\n' : 'continue;\n';

const B = (type, fields = {}, inputs = {}) => ({ type, fields, inputs });
const val = blk => ({ block: blk });
const chain = arr => { for (let i = arr.length - 2; i >= 0; i--) arr[i].next = { block: arr[i + 1] }; return { block: arr[0] }; };
const N = n => val(B('math_number', { NUM: n })), T = t => val(B('text', { TEXT: t })), V = n => val(B('var_get', { NAME: n }));

const sample = { blocks: { languageVersion: 0, blocks: [
  { ...B('class_def', { SER: true, ACCESS: 'public', NAME: 'Item', BASE: '' }, { MEMBERS: chain([
      B('field_def', { ACCESS: 'public', TYPE: 'string', NAME: 'itemName' }, { VALUE: T('Potion') }),
      B('field_def', { ACCESS: 'public', TYPE: 'int', NAME: 'price' }, { VALUE: N(100) }),
    ]) }), x: 20, y: 20 },

    const t = typeOf(b.getInputTargetBlock('LIST'));
    if (t !== '?' && elemOf(t) === '?') E(b, dictOf(t) ? 'Dictionary には辞書用のブロックを使ってください' : `'${t}' は List ではありません`);
    return elemOf(t);
  };
  const listOrDict = b => {
    const t = typeOf(b.getInputTargetBlock('LIST')), d = dictOf(t);
    if (d) return d;
    if (t !== '?' && elemOf(t) === '?') E(b, `'${t}' は List / Dictionary ではありません`);
    return ['int', elemOf(t)];
  };
  const dictOfBlock = b => {
    const t = typeOf(b.getInputTargetBlock('LIST'));
    if (t !== '?' && !dictOf(t)) E(b, `'${t}' は Dictionary ではありません`);
    return dictOf(t) || ['?', '?'];
  };
  const resolved = (b, path) => { const r = resolve(path, scopeOf(b)); if (r.err) E(b, r.err); else if (r.warn) W(b, r.warn); return r; };
  const classNames = new Set(); let monos = 0;
  for (const b of ws.getAllBlocks(true)) {
    if (!b.isEnabled() || b.isShadow()) continue;
    if ((REQUIRED[b.type] || []).some(n => !b.getInputTargetBlock(n))) E(b, '空いているスロットにブロックをつないでください');
    const par = b.getSurroundParent();
    if (par && par.type === 'switch_stmt' && !b.outputConnection && !['case_clause', 'default_clause'].includes(b.type)) { E(b, 'switch の中には case / default を置いてください'); continue; }
    if (MEMBER_BLOCKS.includes(b.type)) {
      if (!par || par.type !== 'class_def') { E(b, 'クラスの中に置いてください'); continue; }
    } else if (!['class_def', 'enum_def', 'using_def', 'init_assign', 'switch_arm'].includes(b.type) && !b.outputConnection && !scopeOf(b).method) {
      E(b, par && par.type === 'class_def' ? 'この文はメソッド (Unityイベント) の中に置いてください' : 'メソッド (Unityイベント) の中に置いてください');
      continue;
    } else if (b.outputConnection && !b.getParent()) { W(b, 'どこにもつながっていない式です'); continue; }

    switch (b.type) {
      case 'class_def': {
        const n = name(b, 'NAME');
        if (classNames.has(n)) E(b, `クラス '${n}' が重複しています`);
        classNames.add(n);
        if (isMono(MODEL.get(n)) && ++monos === 2) W(b, 'Unity では 1 ファイルに MonoBehaviour は 1 つ (ファイル名 = クラス名) にしてください');
        const seen = new Set();
        for (let m = b.getInputTargetBlock('MEMBERS'); m; m = m.getNextBlock()) {
          if (m.type === 'raw_member') continue;
          const key = m.type === 'unity_event' ? f(m, 'EVENT').split('(')[0]
            : m.type === 'method_def' ? f(m, 'NAME') + '(' + params(f(m, 'PARAMS')).map(p => p[0]).join(',') + ')'
            : m.type === 'constructor_def' ? 'コンストラクター(' + params(f(m, 'PARAMS')).map(p => p[0]).join(',') + ')' : f(m, 'NAME');
          if (seen.has(key)) E(m, `'${key.split('(')[0]}' が重複しています`);
          seen.add(key);
        }
        break;
      }
      case 'field_def': name(b, 'NAME'); type(b, f(b, 'TYPE').trim()); want(b, 'VALUE', f(b, 'TYPE').trim()); break;
      case 'method_def': {
        const ret = f(b, 'RET').trim();
        name(b, 'NAME'); type(b, ret);
        params(f(b, 'PARAMS')).forEach(([t, n]) => t === '?' ? E(b, `引数 '${n}' の書き方が不正です (例: int a, string b)`) : type(b, t));
        if (ret !== 'void' && !b.getDescendants(false).some(d => (d.type === 'return_stmt' && d.getInputTargetBlock('VALUE')) || d.type.startsWith('yield_')))
          E(b, `'${f(b, 'NAME')}' は ${ret} を return する必要があります`);
        break;
      }
      case 'var_local': {
        const n = name(b, 'NAME'), t = f(b, 'TYPE').trim();
        if (scopeOf(b).vars.has(n)) E(b, `'${n}' は既に定義されています`);
        if (t === 'var') { if (!b.getInputTargetBlock('VALUE')) E(b, 'var には初期値が必要です'); }
        else { type(b, t); want(b, 'VALUE', t); }
        break;
      }
      case 'var_set': {
        const r = resolved(b, f(b, 'NAME')), op = f(b, 'OP');
        if (r.err) break;
        if (op === '=') want(b, 'VALUE', r.type);
        else if (r.type === 'bool' || (r.type === 'string' && op !== '+=')) E(b, `'${r.type}' に ${op} は使えません`);
        break;
      }
      case 'var_get': resolved(b, f(b, 'NAME')); break;
      case 'method_call': case 'method_call_expr': resolved(b, f(b, 'NAME') + '()'); break;
      case 'new_object': {
        const n = f(b, 'NAME').trim();
        type(b, n);
        if (isMono(MODEL.get(n))) W(b, 'MonoBehaviour は new できません。AddComponent<T>() を使ってください');
        break;
      }
      case 'return_stmt': {
        const m = scopeOf(b).method, vb = b.getInputTargetBlock('VALUE');
        if (m.ret === 'IEnumerator') E(b, 'コルーチンでは return ではなく yield を使います');
        else if (m.ret === 'void' && vb) E(b, 'void メソッドは値を返せません');
        else if (m.ret !== 'void' && !vb) E(b, `${m.ret} の値を返す必要があります`);
        else assign(b, m.ret, vb);
        break;
      }
      case 'list_new': type(b, f(b, 'TYPE').trim()); break;
      case 'get_component': {
        const t = f(b, 'TYPE').trim();
        type(b, t);
        if (MODEL.has(t) && !isMono(MODEL.get(t))) E(b, `'${t}' はコンポーネントではありません`);
        break;
      }
      case 'list_add': case 'list_contains': want(b, 'VALUE', listOf(b)); break;
      case 'list_set': { const [k, val] = listOrDict(b); want(b, 'VALUE', val); want(b, 'INDEX', k); break; }
      case 'list_get': want(b, 'INDEX', listOrDict(b)[0]); break;
      case 'list_remove': { const el = listOf(b); want(b, 'VALUE', f(b, 'OP') === 'RemoveAt' ? 'int' : el); break; }
      case 'list_clear': case 'list_count': listOrDict(b); break;
      case 'list_foreach': {
        if (dictOf(typeOf(b.getInputTargetBlock('LIST')))) break;
        const el = listOf(b), t = f(b, 'TYPE').trim();
        name(b, 'VAR');
        if (t !== 'var') { type(b, t); if (!assignable(t, el)) E(b, `'${el}' を '${t}' に変換できません`); }
        break;
      }
      case 'controls_if': for (let i = 0; b.getInput('IF' + i); i++) want(b, 'IF' + i, 'bool'); break;
      case 'controls_whileUntil': want(b, 'BOOL', 'bool'); break;
      case 'logic_operation': want(b, 'A', 'bool'); want(b, 'B', 'bool'); break;
      case 'logic_negate': want(b, 'BOOL', 'bool'); break;
      case 'controls_repeat_ext': want(b, 'TIMES', 'int'); break;
      case 'for_range': name(b, 'VAR'); want(b, 'FROM', 'int'); want(b, 'TO', 'int'); break;
      case 'math_arithmetic':
        if (f(b, 'OP') !== 'ADD' && ['A', 'B'].some(n => typeOf(b.getInputTargetBlock(n)) === 'string')) E(b, '文字列には + 以外の演算は使えません');
        break;
      case 'transform_set': want(b, 'VALUE', MEMBERS.Transform[f(b, 'PROP')]); break;
      case 'transform_action': if (f(b, 'ACTION') !== 'LookAt') want(b, 'VEC', 'Vector3'); break;
      case 'enum_def': {
        const n = name(b, 'NAME');
        if (classNames.has(n)) E(b, `'${n}' が重複しています`);
        classNames.add(n);
        f(b, 'VALUES').split(',').map(s => s.trim()).filter(Boolean).forEach(s => { if (!/^[A-Za-z_]\w*(\s*=\s*-?\d+)?$/.test(s)) E(b, `値 '${s}' は使えません`); });
        break;
      }
      case 'property_def': name(b, 'NAME'); type(b, f(b, 'TYPE').trim()); break;
      case 'constructor_def': case 'coroutine_def':
        if (b.type === 'coroutine_def') {
          name(b, 'NAME');
          if (!b.getDescendants(false).some(d => d.type.startsWith('yield_'))) W(b, 'yield がありません');
        }
        params(f(b, 'PARAMS')).forEach(([t, n]) => t === '?' ? E(b, `引数 '${n}' の書き方が不正です (例: int a, string b)`) : type(b, t));
        break;
      case 'yield_wait': case 'yield_null':
        if (scopeOf(b).method.ret !== 'IEnumerator') E(b, 'yield はコルーチンの中でのみ使えます');
        if (b.type === 'yield_wait') want(b, 'SEC', 'float');
        break;
      case 'start_coroutine': {
        const r = resolved(b, f(b, 'NAME') + '()');
        if (!r.err && r.type !== '?' && r.type !== 'IEnumerator') E(b, `'${f(b, 'NAME')}' はコルーチン (IEnumerator) ではありません`);
        break;
      }
      case 'invoke_stmt': resolved(b, f(b, 'NAME') + '()'); want(b, 'SEC', 'float'); break;
      case 'case_clause': case 'default_clause': if (!par || par.type !== 'switch_stmt') E(b, 'switch の中に置いてください'); break;
      case 'var_incr': {
        const r = resolved(b, f(b, 'NAME'));
        if (!r.err && !['int', 'float', 'double', 'long', '?'].includes(r.type)) E(b, `'${r.type}' に ${f(b, 'OP')} は使えません`);
        break;
      }
      case 'math_func1': want(b, 'X', 'float'); break;
      case 'math_func2': want(b, 'A', 'float'); want(b, 'B', 'float'); break;
      case 'math_func3': ['A', 'B', 'C'].forEach(n => want(b, n, 'float')); break;
      case 'logic_ternary': want(b, 'IF', 'bool'); break;
      case 'vector3_func': want(b, 'A', 'Vector3'); want(b, 'B', 'Vector3'); break;
      case 'vector3_lerp': want(b, 'A', 'Vector3'); want(b, 'B', 'Vector3'); want(b, 'C', 'float'); break;
      case 'quaternion_euler': ['X', 'Y', 'Z'].forEach(n => want(b, n, 'float')); break;
      case 'rb_addforce': want(b, 'RB', 'Rigidbody'); want(b, 'VEC', 'Vector3'); break;
      case 'set_active': want(b, 'OBJ', 'GameObject'); want(b, 'BOOL', 'bool'); break;
      case 'compare_tag': {
        const t = typeOf(b.getInputTargetBlock('OBJ')), mem = membersOf(t);
        if (t !== '?' && mem && !('CompareTag()' in mem)) E(b, `'${t}' に CompareTag はありません`);
        break;
      }
      case 'add_component': {
        const t = f(b, 'TYPE').trim();
        type(b, t);
        if (MODEL.has(t) && !isMono(MODEL.get(t))) E(b, `'${t}' はコンポーネントではありません`);
        break;
      }
      case 'load_scene': { const t = typeOf(b.getInputTargetBlock('SCENE')); if (!['string', 'int', '?'].includes(t)) E(b, 'シーン名 (string) か番号 (int) を指定してください'); break; }
      case 'destroy': want(b, 'DELAY', 'float'); break;
      case 'property_expr': name(b, 'NAME'); type(b, f(b, 'TYPE').trim()); want(b, 'VALUE', f(b, 'TYPE').trim()); break;
      case 'new_object_init': type(b, f(b, 'NAME').trim()); break;
      case 'init_assign': {
        if (!par || par.type !== 'new_object_init') { E(b, 'new { } (オブジェクト初期化子) の中に置いてください'); break; }
        const t = f(par, 'NAME').trim(), mem = membersOf(t), n = f(b, 'NAME').trim();
        if (mem && !(n in mem)) (MODEL.has(t) ? E : W)(b, `'${t}' に '${n}' はありません`);
        else if (mem) want(b, 'VALUE', mem[n]);
        break;
      }
      case 'switch_arm': if (!par || par.type !== 'switch_expr') E(b, 'switch 式の中に置いてください'); break;
      case 'tuple_assign': resolved(b, f(b, 'NAME1')); resolved(b, f(b, 'NAME2')); break;
      case 'array_new': type(b, f(b, 'TYPE').trim()); want(b, 'SIZE', 'int'); break;
      case 'generic_call': case 'call_on': {
        const n = f(b, 'NAME').trim(), t = b.getInputTargetBlock('OBJ') ? typeOf(b.getInputTargetBlock('OBJ')) : '?', mem = membersOf(t);
        if (b.type === 'generic_call') {
          type(b, f(b, 'TYPE').trim());
          if (/Component/.test(n) && MODEL.has(f(b, 'TYPE').trim()) && !isMono(MODEL.get(f(b, 'TYPE').trim()))) E(b, `'${f(b, 'TYPE').trim()}' はコンポーネントではありません`);
        }
        if (mem && !(n + '()' in mem)) (MODEL.has(t) ? E : W)(b, `'${t}' に ${n} はありません`);
        break;
      }
      case 'raycast_if': name(b, 'HIT'); want(b, 'ORIGIN', 'Vector3'); want(b, 'DIR', 'Vector3'); want(b, 'DIST', 'float'); break;
      case 'raycast_mouse_if': name(b, 'HIT'); want(b, 'DIST', 'float'); break;
      case 'hit_get': { const r = resolved(b, f(b, 'HIT')); if (!r.err && !['RaycastHit', '?'].includes(r.type)) E(b, `'${f(b, 'HIT')}' は RaycastHit ではありません`); break; }
      case 'draw_ray': want(b, 'ORIGIN', 'Vector3'); want(b, 'DIR', 'Vector3'); want(b, 'COLOR', 'Color'); break;
      case 'ui_set_text': case 'prop_set': case 'prop_get': {
        const t = typeOf(b.getInputTargetBlock('OBJ')), mem = membersOf(t), p = b.type === 'ui_set_text' ? 'text' : f(b, 'PROP').trim();
        if (mem && !(p in mem)) (MODEL.has(t) ? E : W)(b, `'${t}' に '${p}' はありません`);
        else if (mem && b.type !== 'prop_get') want(b, 'VALUE', mem[p]);
        break;
      }
      case 'button_listener': want(b, 'OBJ', 'Button'); resolved(b, f(b, 'NAME') + '()'); break;
      case 'audio_play': want(b, 'OBJ', 'AudioSource'); break;
      case 'audio_oneshot': want(b, 'OBJ', 'AudioSource'); want(b, 'CLIP', 'AudioClip'); break;
      case 'anim_trigger': want(b, 'OBJ', 'Animator'); break;
      case 'anim_set': want(b, 'OBJ', 'Animator'); want(b, 'VALUE', { SetBool: 'bool', SetFloat: 'float', SetInteger: 'int' }[f(b, 'FN')]); break;
      case 'prefs_set': want(b, 'VALUE', { SetInt: 'int', SetFloat: 'float', SetString: 'string' }[f(b, 'FN')]); break;
      case 'prefs_get': want(b, 'DEF', { GetInt: 'int', GetFloat: 'float', GetString: 'string' }[f(b, 'FN')]); break;

      case 'list_insert': want(b, 'VALUE', listOf(b)); want(b, 'INDEX', 'int'); break;
      case 'list_index_of': want(b, 'VALUE', listOf(b)); break;
      case 'list_order': listOf(b); break;
      case 'dict_new': type(b, f(b, 'KEY').trim()); type(b, f(b, 'VAL').trim()); break;
      case 'dict_add': { const [k, val] = dictOfBlock(b); want(b, 'KEY', k); want(b, 'VALUE', val); break; }
      case 'dict_contains': case 'dict_remove': want(b, 'KEY', dictOfBlock(b)[0]); break;

      case 'vector3_new': ['X', 'Y', 'Z'].forEach(n => want(b, n, 'float')); break;
      case 'random_range': want(b, 'A', 'float'); want(b, 'B', 'float'); break;
      case 'instantiate': want(b, 'POS', 'Vector3'); break;
    }
  }
  // ブロックに警告アイコンを付ける
  const byBlock = new Map();
  out.forEach(x => byBlock.set(x.block, new Set([...(byBlock.get(x.block) || []), (x.level === 'error' ? '✖ ' : '⚠ ') + x.msg])));
  Blockly.Events.disable();
  try {
    for (const b of ws.getAllBlocks(false)) {
      const t = [...(byBlock.get(b) || [])].join('\n');
      if ((lastWarn.get(b.id) || '') !== t) { b.setWarningText(t || null); lastWarn.set(b.id, t); }
    }
  } finally { Blockly.Events.enable(); }
  return out.filter((x, i) => out.findIndex(y => y.block === x.block && y.msg === x.msg) === i);
}

// ---------- 構文チェック (tree-sitter C# パーサー) ----------
let tsParser = null, tsState = '構文チェッカー読込中…';
(async () => {
  try {
    await TreeSitter.init({ locateFile: n => 'https://unpkg.com/web-tree-sitter@0.20.8/' + n });
    const p = new TreeSitter();
    p.setLanguage(await TreeSitter.Language.load('https://unpkg.com/tree-sitter-wasms@0.1.11/out/tree-sitter-c_sharp.wasm'));
    tsParser = p; tsState = '';
  } catch (e) { tsState = '構文チェッカーを読み込めませんでした (意味チェックのみ)'; }
  if (typeof update === 'function') update();
})();
function syntaxErrors(src) {
  if (!tsParser) return [];
  const out = [], tree = tsParser.parse(src);
  (function walk(n) {
    if (n.type === 'ERROR' || n.isMissing()) {
      out.push({ line: n.startPosition.row + 1, level: 'error',
        msg: n.isMissing() ? `構文エラー: '${n.type}' がありません` : `構文エラー: ${src.slice(n.startIndex, n.endIndex).split('\n')[0].trim().slice(0, 40)}` });
    } else if (n.hasError()) for (let i = 0; i < n.childCount; i++) walk(n.child(i));
  })(tree.rootNode);
  tree.delete();
  return out;
}

// ---------- 入力補完 (Tab で確定) ----------
const AC = {
  el: Object.assign(document.createElement('div'), { id: 'ac', hidden: true }),
  items: [], idx: 0, field: null, from: 0, to: 0, moved: false,
  candidates(field, token) {
    const kind = field.acKind, sc = scopeOf(field.getSourceBlock());
    if (['member', 'member_method', 'initmember'].includes(kind)) {
      const blk = field.getSourceBlock(), par = blk.getSurroundParent();
      const t = kind === 'initmember' ? (par && par.type === 'new_object_init' ? f(par, 'NAME').trim() : '?') : typeOf(blk.getInputTargetBlock('OBJ'));
      return Object.entries(membersOf(t) || {}).filter(([n]) => n.endsWith('()') === (kind === 'member_method'))
        .map(([n, ty]) => ({ label: n, insert: n.replace('()', ''), detail: `${ty === '?' ? '' : ty + ' · '}${t}` }));
    }
    const cls = [...MODEL.keys()];
    const T = (list, detail) => list.map(label => ({ label, insert: label, detail }));
    if (['type', 'params', 'base', 'component', 'class'].includes(kind)) {
      if (kind === 'base') return [...T(['MonoBehaviour', 'ScriptableObject'], 'Unity'), ...T(cls, 'クラス')];
      if (kind === 'component') return [...T(COMPONENTS, 'コンポーネント'), ...T(cls.filter(n => isMono(MODEL.get(n))), 'クラス')];
      if (kind === 'class') return [...T(cls, 'クラス'), ...T(UNITY_TYPES, 'Unity')];
      return [...T(PRIMS, '型'), ...T(cls, 'クラス'), ...T(UNITY_TYPES, 'Unity'),
        ...T(['int', 'float', 'string', 'GameObject', ...cls].map(t => `List<${t}>`), 'リスト')];
    }
    const methodOnly = kind === 'method';
    const fromMembers = (mem, detail) => Object.entries(mem || {})
      .filter(([n]) => !methodOnly || n.endsWith('()'))
      .map(([n, t]) => ({ label: n, insert: methodOnly ? n.slice(0, -2) : n, detail: `${t === '?' ? '' : t + ' · '}${detail}` }));
    const dot = token.lastIndexOf('.');
    if (dot >= 0) {
      const r = resolve(token.slice(0, dot), sc);
      return fromMembers(membersOf(r.type), r.type.replace('#', ''));
    }
    const out = [];
    if (!methodOnly) sc.vars.forEach((t, n) => out.push({ label: n, insert: n, detail: t + ' · ローカル' }));
    if (sc.cls) out.push(...fromMembers({ ...sc.cls.members, ...classMembers(sc.cls) }, 'メンバー'));
    if (!methodOnly) out.push({ label: 'this', insert: 'this', detail: 'this' });
    out.push(...T(Object.keys(STATICS), 'Unity'), ...T(cls, 'クラス'));
    return out;
  },
  open(field) {
    this.field = field;
    const inp = field.htmlInput_;
    if (!inp) return;
    MODEL = model();
    const all = inp.selectionStart !== inp.selectionEnd && inp.selectionStart === 0 && inp.selectionEnd === inp.value.length;
    const caret = inp.selectionEnd, before = all ? '' : inp.value.slice(0, caret);
    const typeLike = ['type', 'params', 'base', 'component', 'class'].includes(field.acKind);
    const token = before.match(typeLike ? /[\w<>\[\]]*$/ : /[\w.]*$/)[0];
    const partial = typeLike ? token : token.slice(token.lastIndexOf('.') + 1);
    this.from = all ? 0 : caret - partial.length; this.to = all ? inp.value.length : caret;
    const p = partial.toLowerCase(), seen = new Set();
    this.items = this.candidates(field, token)
      .filter(c => !seen.has(c.label) && seen.add(c.label) && c.label.toLowerCase().includes(p) && c.insert !== partial)
      .sort((a, b) => b.label.toLowerCase().startsWith(p) - a.label.toLowerCase().startsWith(p))
      .slice(0, 60);
    this.idx = 0; this.moved = false;
    if (!this.items.length) return this.close();
    const r = inp.getBoundingClientRect();
    Object.assign(this.el.style, { left: r.left + 'px', top: r.bottom + 4 + 'px' });
    this.el.hidden = false;
    this.draw();
  },
  draw() {
    this.el.innerHTML = this.items.map((c, i) =>
      `<div class="ac-item${i === this.idx ? ' sel' : ''}" data-i="${i}"><span>${esc(c.label)}</span><small>${esc(c.detail)}</small></div>`).join('')
      + '<div class="ac-hint">Tab で確定 · ↑↓ で選択 · Esc で閉じる</div>';
    const sel = this.el.querySelector('.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  },
  accept(i) {
    const inp = this.field && this.field.htmlInput_, c = this.items[i];
    if (!inp || !c) return;
    inp.value = inp.value.slice(0, this.from) + c.insert + inp.value.slice(this.to);
    const pos = this.from + c.insert.length;
    inp.setSelectionRange(pos, pos);
    inp.dispatchEvent(new Event('input'));
  },
  close() { this.el.hidden = true; },
  key(e) {
    if (!this.el.hidden) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        this.idx = (this.idx + (e.key === 'ArrowDown' ? 1 : -1) + this.items.length) % this.items.length;
        this.moved = true; this.draw();
      } else if (e.key === 'Tab' || (e.key === 'Enter' && this.moved)) this.accept(this.idx);
      else if (e.key === 'Escape') this.close();
      else return false;
    } else if (e.key === ' ' && e.ctrlKey) this.open(this.field);
    else return false;
    e.preventDefault(); e.stopPropagation();
    return true;

const KW = new Set('using public private protected internal static class void int float bool string var new return if else for foreach in while break continue true false null this base default'.split(' '));
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(code) {
  const re = /(\/\/[^\n]*)|("(?:\\.|[^"\\\n])*")|\b(\d+(?:\.\d+)?f?)\b|\b([A-Za-z_]\w*)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="n">${m[3]}</span>`;
    else out += KW.has(m[4]) ? `<span class="k">${m[4]}</span>` : /^[A-Z]/.test(m[4]) ? `<span class="t">${m[4]}</span>` : m[4];
  }
  return out + esc(code.slice(last));
}

  fileName = (mono ? f(mono, 'NAME') : 'Script') + '.cs';
  document.getElementById('fname').textContent = fileName;
  const issues = [...syntaxErrors(code), ...check()];
  const errLines = new Set(issues.filter(x => x.line).map(x => x.line));
  document.getElementById('code').innerHTML = hl(code).split('\n').map((l, i) => `<span class="ln${errLines.has(i + 1) ? ' err' : ''}" data-l="${i + 1}">${l}</span>`).join('');
  const nE = issues.filter(x => x.level === 'error').length, nW = issues.length - nE;

    const d = e.target.closest('.issue'); if (!d) return;
    const x = issues[+d.dataset.i];
    if (x.block) { ws.centerOnBlock(x.block.id); x.block.select(); }
    else document.querySelector(`.ln[data-l="${x.line}"]`)?.scrollIntoView({ block: 'center' });
  };
  document.getElementById('undo').disabled = !ws.getUndoStack().length;
  document.getElementById('redo').disabled = !ws.getRedoStack().length;
  try { localStorage.setItem(KEY, JSON.stringify(Blockly.serialization.workspaces.save(ws))); } catch (e) {}
}
ws.addChangeListener(e => { if (!e.isUiEvent) update(); });
update();

document.getElementById('sample').onclick = () => load(sample);
document.getElementById('clear').onclick = () => { Blockly.Events.setGroup(true); ws.clear(); Blockly.Events.setGroup(false); };
const history = redo => { AC.close(); Blockly.hideChaff(); ws.undo(redo); };
document.getElementById('undo').onclick = () => history(false);
document.getElementById('redo').onclick = () => history(true);
// Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z (文字入力中はブラウザ標準の取り消しを使う)
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!(e.ctrlKey || e.metaKey) || (k !== 'z' && k !== 'y') || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  e.preventDefault(); e.stopImmediatePropagation();
  history(k === 'y' || e.shiftKey);
}, true);
document.getElementById('copy').onclick = async e => {
  try { await navigator.clipboard.writeText(code); e.target.textContent = 'コピー済'; }
  catch (err) { e.target.textContent = 'コピー失敗'; }
  setTimeout(() => e.target.textContent = 'コピー', 1500);
};
document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
  a.download = fileName; a.click(); URL.revokeObjectURL(a.href);
};
window.addEventListener('resize', () => Blockly.svgResize(ws));

// C# 読込ダイアログ
const dlg = document.getElementById('importDlg'), msg = document.getElementById('importMsg'), toast = document.getElementById('toast');
let toastTimer;
document.getElementById('import').onclick = () => { msg.textContent = ''; dlg.showModal(); };
document.getElementById('importCancel').onclick = () => dlg.close();
document.getElementById('importFile').onchange = async e => {
  const file = e.target.files[0];
  if (file) { document.getElementById('importSrc').value = await file.text(); srcName = file.name; }
};
let srcName = '貼り付けたコード';
document.getElementById('importSrc').addEventListener('input', () => srcName = '貼り付けたコード');
document.getElementById('importGo').onclick = () => {
  const src = document.getElementById('importSrc').value;
  if (!src.trim()) { msg.textContent = 'C# コードを入力してください'; return; }
  try {
    const r = importCs(src, document.getElementById('importAppend').checked);
    dlg.close();
    const kinds = renderLog(r);
    collect(r, srcName);
    toast.textContent = `${r.count} 個のブロックに変換しました` + (r.log.length ? `\n足りないブロック ${kinds} 種類 / ${r.log.length} か所 → 右の「読み込みログ」の「依頼文を作成」でまとめられます` : '')
      + '\n(取り消しで元に戻せます)';
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.hidden = true, 8000);
  } catch (err) { msg.textContent = '変換できませんでした: ' + err.message; }
};
toast.onclick = () => toast.hidden = true;

// 足りないブロックの累計 (複数回の読み込みをまとめて依頼文にする)
const MISSING_KEY = 'unity-block-coder-missing';
const KIND_ROLE = { raw_stmt: '文として使う', raw_expr: '値 (式) として使う', raw_member: 'クラスのメンバーとして使う' };
let collected = { items: new Map(), notes: [] };
try {
  const d = JSON.parse(localStorage.getItem(MISSING_KEY));
  if (d) collected = { items: new Map(d.items), notes: d.notes };
} catch (e) {}
const saveCollected = () => {
  try { localStorage.setItem(MISSING_KEY, JSON.stringify({ items: [...collected.items], notes: collected.notes })); } catch (e) {}
};
function collect(r, source) {
  for (const e of r.log) {
    const it = collected.items.get(e.need) || { need: e.need, type: e.type, count: 0, examples: [], sources: [], seen: [] };
    const key = `${source}:${e.line}:${e.full}`;
    if (it.seen.includes(key)) continue;
    it.seen.push(key); it.count++;
    if (it.examples.length < 3 && !it.examples.includes(e.full)) it.examples.push(e.full);
    if (!it.sources.includes(source)) it.sources.push(source);
    collected.items.set(e.need, it);
  }
  r.notes.forEach(n => collected.notes.includes(n) || collected.notes.push(n));
  saveCollected();
  renderCollected();
}
function renderCollected() {
  const bar = document.getElementById('collectBar'), items = [...collected.items.values()];
  bar.hidden = !items.length;
  bar.innerHTML = `<span>累計: 足りないブロック ${items.length} 種類 / ${items.reduce((n, x) => n + x.count, 0)} か所</span>`
    + '<span><button id="makeReq" class="primary">依頼文を作成</button> <button id="resetReq">リセット</button></span>';
}
function buildRequest() {
  const items = [...collected.items.values()].sort((a, b) => b.count - a.count), total = items.reduce((n, x) => n + x.count, 0);
  const lines = ['# Unity Block Coder: ブロック追加の依頼', '',
    `C# を読み込んだとき、専用ブロックがなく代用ブロック (C# 文 / 式 / メンバー) になった構文が ${items.length} 種類・計 ${total} か所ありました。`,
    'これらを専用ブロックとして index.html に追加してください。',
    '追加するときは C# 生成・C# 読み込み (Imp)・エラーチェック・Tab 補完・ツールボックスにも対応させ、下のコード例が「読み込み → C# 生成」で元と同じになることを確認してください。',
    '', '## 足りないブロック (多い順)'];
  items.forEach((x, i) => lines.push('', `### ${i + 1}. ${x.need}`, `- 出現数: ${x.count} か所 (${x.sources.join(', ')})`,
    `- 代用されたブロック: 「${KIND[x.type]}」(${KIND_ROLE[x.type]})`, '- コード例:', '```csharp', ...x.examples, '```'));
  if (collected.notes.length) lines.push('', '## 読み込み時に省略されたもの', ...collected.notes.map(n => `- ${n}`));
  lines.push('', `(${new Date().toLocaleString()} Unity Block Coder で作成)`);
  return lines.join('\n');
}
const reqDlg = document.getElementById('reqDlg');
document.getElementById('collectBar').onclick = e => {
  if (e.target.id === 'makeReq') { document.getElementById('reqText').value = buildRequest(); reqDlg.showModal(); }
  if (e.target.id === 'resetReq') { collected = { items: new Map(), notes: [] }; saveCollected(); renderCollected(); }
};
document.getElementById('reqClose').onclick = () => reqDlg.close();
document.getElementById('reqCopy').onclick = async e => {
  try { await navigator.clipboard.writeText(document.getElementById('reqText').value); e.target.textContent = 'コピー済'; }
  catch (err) { document.getElementById('reqText').select(); e.target.textContent = '選択しました (Ctrl+C でコピー)'; }
  setTimeout(() => e.target.textContent = 'コピー', 2000);
};
document.getElementById('reqSave').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([document.getElementById('reqText').value], { type: 'text/markdown' }));
  a.download = 'block-request.md'; a.click(); URL.revokeObjectURL(a.href);
};
renderCollected();

// 問題 / 読み込みログ タブ
const showTab = log => {
  document.getElementById('issues').hidden = log; document.getElementById('importLog').hidden = !log;
  document.getElementById('tabIssues').classList.toggle('on', !log); document.getElementById('tabLog').classList.toggle('on', log);
};
document.getElementById('tabIssues').onclick = () => showTab(false);
document.getElementById('tabLog').onclick = () => showTab(true);
const KIND = { raw_stmt: 'C# 文', raw_expr: 'C# 式', raw_member: 'C# メンバー' };
function renderLog(r) {
  const groups = new Map();
  r.log.forEach(e => groups.set(e.need, (groups.get(e.need) || 0) + 1));
  const sorted = [...groups].sort((a, b) => b[1] - a[1]);
  const text = [`読み込み ${new Date().toLocaleTimeString()} / ブロック ${r.count} 個 / 代用 ${r.log.length} か所`,
    ...sorted.map(([k, c]) => `[足りないブロック] ${k} ×${c}`), ...r.log.map(e => `行 ${e.line}: ${e.need} → ${KIND[e.type]} で代用: ${e.code}`),
    ...r.notes.map(n => `[情報] ${n}`)].join('\n');
  const box = document.getElementById('logBody');
  box.innerHTML = `<div class="log-head"><span>${new Date().toLocaleTimeString()} 読み込み: ブロック ${r.count} 個 / 代用 ${r.log.length} か所</span><button id="copyLog">ログをコピー</button></div>`
    + (sorted.length ? '<div class="log-sec">足りないブロック</div>' + sorted.map(([k, c]) => `<div class="log-need">■ ${esc(k)}<small>×${c}</small></div>`).join('')
      : '<div class="ok">✔ すべて専用ブロックに変換できました</div>')
    + (r.log.length ? '<div class="log-sec">詳細 (クリックでブロックへ移動)</div>' + r.log.map((e, i) =>
      `<div class="issue" data-i="${i}"><b style="color:#f5c04a">行 ${e.line}</b> ${esc(e.need)} → 「${KIND[e.type]}」で代用<code>${esc(e.code)}</code></div>`).join('') : '')
    + (r.notes.length ? '<div class="log-sec">その他</div>' + r.notes.map(n => `<div>ℹ ${esc(n)}</div>`).join('') : '');
  box.onclick = async e => {
    if (e.target.id === 'copyLog') {
      try { await navigator.clipboard.writeText(text); e.target.textContent = 'コピー済'; } catch (err) { e.target.textContent = 'コピー失敗'; }
      return;
    }
    const d = e.target.closest('.issue');
    const blk = d && ws.getBlockById(r.log[+d.dataset.i].id);
    if (blk) { ws.centerOnBlock(blk.id); blk.select(); }
  };
  document.getElementById('tabLog').textContent = `読み込みログ${r.log.length ? ` (${r.log.length})` : ''}`;
  console.log(text);
  showTab(true);
  return groups.size;
}
</script>
